<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <title>AngularJS Custom Service Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
   
</head>
<body>
      <div class="container" ng-app="myApp">
         <div ng-controller="nameCtrl">
            <p>Name :  {{name}}</p>
            <p>Message : {{message}}</p> 
             <p>Sum : {{result}}</p>
             <p>Multiply : {{multi}}</p>
             
         </div>
      </div>

      <script>
          var app=angular.module("myApp",[]);
          app.service("myService",function(){
            this.message=function(){
                return "Hello from MyServ Service";
            };
            this.add=function(a,b){
                return a + b ;
            };
            this.multi=function(a,b){
                return a*b;
            }
            this.name="Technical Ganguly";
          });
          app.controller("nameCtrl",function($scope,myService){
                $scope.result=myService.add(89,69);
                $scope.multi=myService.multi(89,69);
                $scope.message=myService.message();
                $scope.name=myService.name;
          });
      </script>
</body>
</html>
