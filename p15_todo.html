<html>
   <head>
      <title>AngularJS First Application</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
   
   </head>
   
   <body>
      <h1>Sample Application</h1>
      <div ng-app = "myApp" class="container">
         <div ng-controller="nameCtrl">
            <div class="row">
               <div class="col-md-2">
                <input type="text" name="fruit" ng-model="fruit" class="form-control" />
               </div>
               <div class="col-md-2">
                <button type="button" ng-click="addTodo()" class="btn btn-success" >Add</button>
               </div>
            </div>
             
             <ul>
                <li ng-repeat="x in todo">{{x}} - {{$index}} <a ng-click="remove($index)">X</a></li>
             </ul>
         </div>
      </div>

      <script>
          var app=angular.module("myApp",[]);
          app.controller("nameCtrl",function($scope){
            $scope.todo=['Apple','Banana','Mango','PineApple'];
             $scope.addTodo=function(){
                  $scope.todo.push($scope.fruit);
             }
            
             $scope.remove=function(index){
                $scope.todo.splice(index, 1);
             }
          });
      </script>
   </body>
</html>
