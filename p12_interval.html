<!DOCTYPE html>
<html lang="en" ng-app="newsApp">
<head>
    <meta charset="UTF-8">
    <title>Breaking News Ticker</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
        }
        .news-ticker {
            font-size: 20px;
            color: #fff;
            background-color: #333;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            width: 100%;
            overflow: hidden;
        }
        .news-item {
            display: inline-block;
            padding-right: 50px;
            white-space: nowrap;
        }
    </style>
</head>
<body ng-controller="NewsController">

    <h1>Breaking News</h1>
    <div class="news-ticker">
        <span class="news-item" ng-repeat="news in breakingNews">{{ news }}</span>
    </div>

    <script>
        var app = angular.module('newsApp', []);

        app.controller('NewsController', function($scope, $interval) {
            // Initial breaking news headlines
            var newsArray = [
                "New Technology Revolutionizing the Market!",
                "Local Election Results Announced.",
                "Global Markets React to Latest Economic Data.",
                "New Discoveries in Space Exploration.",
                "Health Experts Advise on New Preventive Measures."
            ];

            // Function to fetch the next headline
            $scope.breakingNews = [];
            var currentIndex = 0;

            // Start updating the ticker every 3 seconds
            var newsInterval = $interval(function() {
                $scope.breakingNews.push(newsArray[currentIndex]);
                currentIndex = (currentIndex + 1) % newsArray.length;
                
                // Keep only the last 5 headlines
                if ($scope.breakingNews.length > 5) {
                    $scope.breakingNews.shift();
                }
            }, 1000); // 3000 ms = 3 seconds

            // Clean up the interval when the scope is destroyed
            $scope.$on('$destroy', function() {
                $interval.cancel(newsInterval);
            });
        });
    </script>

</body>
</html>
