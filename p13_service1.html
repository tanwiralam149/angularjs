<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <title>AngularJS Custom Service Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
   
</head>
<body>
      <div class="container" ng-app="myApp">
         <div ng-controller="nameCtrl">
            <input type="text" name="userName" ng-model="userName"/>
            <button ng-click="saveUserName()">Save</button>
            <h3>Saved Name: {{ savedUserName }}</h3>
         </div>
      </div>

      <script>
          var app=angular.module("myApp",[]);
          app.service("myService",function(){
               var userName='';
              this.saveUsername=function(name){
                username=name
              };
              this.getUserName=function(){
                 return userName;
              }
          });
          app.controller("nameCtrl",function($scope,myService){
                $scope.saveUserName=function(){
                    myService.saveUsername($scope.userName);
                    $scope.savedUserName=myService.getUserName()
                }
          });
      </script>
</body>
</html>
